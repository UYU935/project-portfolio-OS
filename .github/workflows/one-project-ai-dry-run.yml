name: One project AI dry run (read only DB)

on:
  workflow_dispatch:
    inputs:
      confirm_paid_request:
        description: 'Make exactly one paid model evaluation request'
        required: true
        default: false
        type: boolean
      confirm_sanitized_project:
        description: 'I confirmed the selected project contains no patient/child/personal secrets'
        required: true
        default: false
        type: boolean
      model:
        description: 'OpenAI model ID'
        required: true
        default: 'gpt-6-sol'
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-one-project-ai-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.ref == 'refs/heads/main' && inputs.confirm_paid_request == true && inputs.confirm_sanitized_project == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: portfolio-preflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install live dependencies
        run: python -m pip install -e '.[live]'
      - name: Evaluate exactly one project without DB writes
        env:
          PORTFOLIO_ONE_PROJECT_TRIAL_REQUESTED: '1'
          TRIAL_CONFIRM_SANITIZED: '1'
          TRIAL_PROJECT_SLUG: ${{ secrets.TRIAL_PROJECT_SLUG }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model }}
        run: python scripts/one_project_dry_run.py

# Manual-only. One evaluation request. No DB writes, web search, Codex, schedule, or external messaging.
