name: One project research evidence pilot

on:
  workflow_dispatch:
    inputs:
      confirm_paid_research:
        description: 'Make one paid model request with at most one web-search tool call'
        required: true
        default: false
        type: boolean
      confirm_persist_evidence:
        description: 'Persist retrieved public-web findings as evidence'
        required: true
        default: false
        type: boolean
      confirm_sanitized_project:
        description: 'I confirmed the selected project contains no patient/child/personal secrets'
        required: true
        default: false
        type: boolean
      model:
        description: 'OpenAI model ID'
        required: true
        default: 'gpt-6-sol'
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-one-project-research-pilot
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/main' && inputs.confirm_paid_research == true && inputs.confirm_persist_evidence == true && inputs.confirm_sanitized_project == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: portfolio-preflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install live dependencies
        run: python -m pip install -e '.[live]'
      - name: Research one project and persist retrieved evidence
        env:
          PORTFOLIO_RESEARCH_PILOT_REQUESTED: '1'
          TRIAL_CONFIRM_SANITIZED: '1'
          TRIAL_CONFIRM_PERSIST_EVIDENCE: '1'
          TRIAL_PROJECT_SLUG: ${{ secrets.TRIAL_PROJECT_SLUG }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model }}
        run: python scripts/one_project_research_pilot.py

# Manual-only. One model request, at most one web search tool call.
# Persists retrieved evidence + run/audit trail. Keeps portfolio paused and
# does not change project stage/mode/automation/human slot, create approvals,
# run Codex, schedule work, or send external messages.
