name: OpenAI auth preflight (no inference)

on:
  workflow_dispatch:
    inputs:
      confirm_no_inference:
        description: 'Check API authentication/model visibility only; do not run a model'
        required: true
        default: false
        type: boolean
      model:
        description: 'Model ID to verify'
        required: true
        default: 'gpt-6-sol'
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-openai-auth-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && inputs.confirm_no_inference == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: portfolio-preflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install client
        run: python -m pip install -e .
      - name: Check OpenAI authentication and model visibility
        env:
          OPENAI_PREFLIGHT_REQUESTED: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model }}
        run: python scripts/openai_auth_preflight.py

# This workflow calls GET /v1/models only. It does not create a Response or call tools.
