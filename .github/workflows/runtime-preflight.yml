name: Runtime preflight (read only)
on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: 'Run only read-only connection checks; no model calls or state changes'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: portfolio-runtime-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && inputs.confirm_read_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: portfolio-preflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require private database setting without printing it
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          if not os.environ.get('DATABASE_URL', '').strip():
              print('SETUP_REQUIRED: Add DATABASE_URL to the portfolio-preflight environment secrets.')
              sys.exit(2)
          print('Required setting is present; value is not displayed.')
          PY
      - name: Install database client (no secrets in this step)
        run: python -m pip install -e '.[live]'
      - name: Run read-only database checks with allowlisted log output
        env:
          PORTFOLIO_PREFLIGHT_REQUESTED: '1'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
        run: python scripts/github_preflight.py
# No schedule/push/PR trigger, model key, database writes, reports or artifacts.
