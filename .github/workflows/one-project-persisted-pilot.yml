name: One project persisted evaluation pilot

on:
  workflow_dispatch:
    inputs:
      confirm_paid_request:
        description: 'Make exactly one paid model evaluation request'
        required: true
        default: false
        type: boolean
      confirm_persist_evaluation:
        description: 'Persist the evaluation and audit record, but do not apply it to project state'
        required: true
        default: false
        type: boolean
      confirm_sanitized_project:
        description: 'I confirmed the selected project contains no patient/child/personal secrets'
        required: true
        default: false
        type: boolean
      model:
        description: 'OpenAI model ID'
        required: true
        default: 'gpt-6-sol'
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-one-project-persisted-pilot
  cancel-in-progress: false

jobs:
  pilot:
    if: github.ref == 'refs/heads/main' && inputs.confirm_paid_request == true && inputs.confirm_persist_evaluation == true && inputs.confirm_sanitized_project == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: portfolio-preflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install live dependencies
        run: python -m pip install -e '.[live]'
      - name: Evaluate and persist exactly one project without applying recommendation
        env:
          PORTFOLIO_PERSISTED_PILOT_REQUESTED: '1'
          TRIAL_CONFIRM_SANITIZED: '1'
          TRIAL_CONFIRM_PERSIST: '1'
          TRIAL_PROJECT_SLUG: ${{ secrets.TRIAL_PROJECT_SLUG }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model }}
        run: python scripts/one_project_persisted_pilot.py

# Manual-only. One evaluation request. Persists run + append-only audit only.
# Does not change project stage/mode/automation, create tasks/approvals, search web,
# run Codex, schedule work, or send external messages.
